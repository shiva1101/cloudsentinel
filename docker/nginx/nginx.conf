worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with timing info (useful for Prometheus scraping)
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    gzip on;

    # ── Upstream: CloudSentinel App ─────────────────────────────────────────
    upstream cloudsentinel_app {
        least_conn;               # Route to least busy instance
        server app:3000;
        keepalive 32;
    }

    # ── Main Server ─────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Proxy to app
        location / {
            proxy_pass http://cloudsentinel_app;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # Stub status for nginx-prometheus-exporter
        location /stub_status {
            stub_status on;
            access_log off;
            allow 172.0.0.0/8;   # Docker network
            deny all;
        }

        # Health check endpoint
        location /nginx-health {
            return 200 'ok\n';
            add_header Content-Type text/plain;
            access_log off;
        }
    }
}
